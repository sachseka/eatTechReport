# Planned website address; building this site does not deploy it.
url: https://sachseka.github.io/eatTechReport/
destination: _pkgdown
development:
  mode: unreleased
template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  bslib:
    primary: "#B40036"
    link-color-dark: "#FF8FAC"
home:
  title: Technische VERA-Berichte aus R und Quarto
  description: >
    Testdesign, Stichprobenbeschreibung und PV-Leistungskennzahlen für VERA-3
    sowie Word-Abschnitte aus redigierbaren Quarto-Textbausteinen.
navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Einstieg
      href: articles/einstieg.html
    articles:
      text: Anleitungen
      menu:
        - text: Testdesign und Stichprobe
          href: articles/pilotierung.html
        - text: Leistungskennzahlen und PVs
          href: articles/leistung.html
        - text: Haupttest-Auswahl und Module
          href: articles/haupttest.html
        - text: Word-Bericht und Textredaktion
          href: articles/textredaktion.html
reference:
  - title: Beispieldaten und Eingaben
    contents:
      - example_report
      - example_leistung_input
      - validate_report_input
      - validate_leistung_input
  - title: Kennzahlen und Grafiken
    contents:
      - summarise_report_input
      - summarise_leistung_input
      - plot_performance
      - plot_item_levels
  - title: Word-Bericht und Textredaktion
    contents:
      - render_report
      - edit_report_texts
articles:
  - title: Arbeiten mit eatTechReport
    navbar: ~
    contents:
      - einstieg
      - pilotierung
      - haupttest
      - leistung
      - textredaktion
