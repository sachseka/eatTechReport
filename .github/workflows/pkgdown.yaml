# Use only repository-approved Actions. Pages deployment uses GitHub's REST API.
name: pkgdown

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages-artifact-id: ${{ steps.pages-artifact.outputs.artifact-id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the Pages deployment helper
        run: node --test .github/scripts/deploy-pages.test.cjs
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          install-quarto: true
      - name: Build and validate the package website
        shell: Rscript {0}
        run: |
          pkgdown::build_site_github_pages(dest_dir = "_pkgdown", new_process = FALSE, install = FALSE)
          pkgdown::check_pkgdown()
      - name: Package the generated website
        shell: bash
        run: |
          test -f _pkgdown/index.html
          test -f _pkgdown/.nojekyll
          tar --dereference --hard-dereference --directory _pkgdown \
            --exclude=.git --exclude=.github \
            -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v7
        id: pages-artifact
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy the website through the GitHub Pages API
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        id: deployment
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages-artifact-id }}
        with:
          script: |
            const deploy = require('./.github/scripts/deploy-pages.cjs');
            await deploy({ github, context, core,
              artifactId: process.env.PAGES_ARTIFACT_ID });
